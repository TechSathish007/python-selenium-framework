name: Run Selenium Tests

on: [push]

jobs:
  automation-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Dependencies
        run: pip install -r requirements.txt
        
      - name: Run Tests
        run: pytest test_pom.py